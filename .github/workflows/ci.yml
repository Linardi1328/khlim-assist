name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: khlim_assist_ci
          POSTGRES_USER: khlim_assist
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khlim_assist -d khlim_assist_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://khlim_assist@localhost:5432/khlim_assist_ci
      POSTGRES_SMOKE_DATABASE_URL: postgresql+asyncpg://khlim_assist@localhost:5432/khlim_assist_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy backend/app

      - name: Alembic PostgreSQL migration
        run: alembic upgrade head

      - name: Pytest
        run: pytest
