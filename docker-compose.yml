services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khlim_assist
      POSTGRES_USER: khlim_assist
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - khlim_assist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khlim_assist -d khlim_assist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  khlim_assist_pgdata:
